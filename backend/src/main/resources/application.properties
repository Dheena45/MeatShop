server.port=${PORT:8082}

# ---------------------------------------------------------------------------
# MongoDB (Atlas)
#
# The full connection string — including the password — is supplied ONLY
# through the MONGODB_URI environment variable. It is never written down in
# this file and never logged. If the variable is missing the application
# fails fast at startup instead of falling back to a local database.
# ---------------------------------------------------------------------------
spring.data.mongodb.uri=${MONGODB_URI}

# Recreate the indexes declared on the document classes (@Indexed) at startup.
# This is the equivalent of the old Hibernate "ddl-auto=update" for the
# uniqueness guarantees (email, phone, order number, invoice number, ...).
spring.data.mongodb.auto-index-creation=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.jwt.secret=${APP_JWT_SECRET:freshmeat-jwt-secret-key-that-is-long-enough-for-hs256-algorithm-2024}
app.jwt.expiration=86400000
app.upload.path=uploads/products
app.base.url=http://localhost:8082

# Admin setup secret - REQUIRED for creating first admin account
# Set this via environment variable APP_ADMIN_SETUP_SECRET
app.admin.setup.secret=${APP_ADMIN_SETUP_SECRET:}

# Comma-separated list of browser origins allowed to call this API.
# The React + Vite dev server runs on 5173; 8080 is kept for the legacy
# same-origin static UI. Never add a wildcard here because credentials
# (the JWT Authorization header) are allowed.
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
