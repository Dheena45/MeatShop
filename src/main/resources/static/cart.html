<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart — FreshMeat</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥩</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="shared-header"></div>

<section class="section-pad pt-4">
    <div class="container">
        <h1 class="section-title mb-4">Your Cart</h1>
        <div id="cart-loading"><div class="loader-spinner"></div></div>
        <div id="cart-content" class="d-none">
            <div class="row g-4">
                <div class="col-lg-8">
                    <div id="cart-items" class="cart-table"></div>
                    <div class="d-flex justify-content-between flex-wrap gap-2 mt-3">
                        <a href="/shop.html" class="btn btn-fm-outline"><i class="fa-solid fa-arrow-left me-1"></i> Continue Shopping</a>
                        <button class="btn btn-fm-outline text-danger border-danger" onclick="clearCart()" style="border-color:#dc3545;color:#dc3545;">
                            <i class="fa-solid fa-trash me-1"></i>Clear Cart</button>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="summary-card">
                        <h5 class="mb-3">Order Summary</h5>
                        <div class="summary-line"><span>Items</span><span id="sum-items">0</span></div>
                        <div class="summary-line"><span>Subtotal</span><span id="sum-subtotal">₹0.00</span></div>
                        <div class="summary-line muted"><span>Discount</span><span id="sum-discount" class="text-success">- ₹0.00</span></div>
                        <div class="summary-line muted"><span>Delivery Charge</span><span id="sum-delivery">₹0.00</span></div>
                        <div class="summary-divider"></div>
                        <div class="summary-total"><span>Grand Total</span><span id="sum-total">₹0.00</span></div>
                        <small class="text-muted d-block mt-1">Free delivery on orders above ₹499</small>
                        <button class="btn btn-fm w-100 btn-fm-lg mt-3" onclick="goCheckout()">
                            <i class="fa-solid fa-lock me-1"></i>Proceed to Checkout</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<div id="shared-footer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/cart.js"></script>
</body>
</html>
