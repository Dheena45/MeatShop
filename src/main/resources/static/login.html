<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — FreshMeat</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥩</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-head">
            <h2 style="font-family:var(--font-head);">Fresh<span style="color:var(--gold-light)">Meat</span></h2>
            <p>Welcome back! Login to your account.</p>
        </div>
        <div class="auth-body">
            <form id="login-form" novalidate>
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Email Address</label>
                    <input type="email" class="form-control form-control-fm" id="email" placeholder="you@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Password</label>
                    <input type="password" class="form-control form-control-fm" id="password" placeholder="Enter your password" required>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label small" for="remember">Remember me</label>
                    </div>
                    <a href="#" class="small" onclick="showToast('Password reset coming soon', 'info');return false;">Forgot password?</a>
                </div>
                <button class="btn btn-fm w-100 btn-fm-lg" type="submit" id="login-btn">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Login
                </button>
            </form>

            <div class="auth-divider"><span>New to FreshMeat?</span></div>
            <a href="/register.html" class="btn btn-fm-outline w-100">Create an Account</a>
            <p class="text-center mt-3 small text-muted mb-0">
                Admin? Use <strong>admin@freshmeat.com</strong> /
            </p>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
