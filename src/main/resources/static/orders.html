<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders — FreshMeat</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥩</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="shared-header"></div>

<section class="section-pad pt-4">
    <div class="container">
        <h1 class="section-title mb-4">My Orders</h1>
        <div id="orders-loading"><div class="loader-spinner"></div></div>
        <div id="orders-list" class="d-none"></div>
    </div>
</section>

<div id="shared-footer"></div>

<!-- Order detail modal -->
<div class="modal fade" id="orderDetailModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="fa-solid fa-receipt me-2 text-primary"></i>Order Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="orderDetailModalBody"></div>
    </div>
  </div>
</div>

<!-- Cancel order confirmation modal -->
<div class="modal fade" id="cancelOrderModal" tabindex="-1" aria-labelledby="cancelOrderModalLabel" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="cancelOrderModalLabel"><i class="fa-solid fa-ban text-danger me-2"></i>Cancel Order</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center pb-2">
        <div class="confirm-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <p class="mb-0 fw-semibold">Are you sure you want to cancel this order?</p>
        <div class="confirm-order-info">
          <span>Order No: <strong id="cancelOrderNo">-</strong></span>
          <span>Items: <strong id="cancelOrderItems">-</strong></span>
          <span>Total: <strong id="cancelOrderTotal">-</strong></span>
        </div>
        <p class="small text-muted mt-3 mb-0"><i class="fa-solid fa-circle-info me-1"></i>This action cannot be undone.</p>
      </div>
      <div class="modal-footer border-0 justify-content-center pb-4 pt-2">
        <button type="button" class="btn btn-fm-outline" data-bs-dismiss="modal">Keep Order</button>
        <button type="button" class="btn btn-danger-fm" id="confirmCancelBtn" onclick="confirmCancelOrder()">Cancel Order</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/orders.js"></script>
</body>
</html>
