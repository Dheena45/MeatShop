<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offers — FreshMeat Admin</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥩</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

<div id="admin-shell"></div>

<!-- Offer edit modal -->
<div class="modal fade" id="offerModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="offerModalTitle">Add Offer</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-8">
            <label class="form-label">Title *</label>
            <input type="text" class="form-control form-control-fm" id="of-title" maxlength="150">
          </div>
          <div class="col-md-4">
            <label class="form-label">Discount % *</label>
            <input type="number" class="form-control form-control-fm" id="of-discount" min="1" max="90" step="0.5">
          </div>
          <div class="col-12">
            <label class="form-label">Description</label>
            <input type="text" class="form-control form-control-fm" id="of-desc" maxlength="300">
          </div>
          <div class="col-md-6">
            <label class="form-label">Coupon Code</label>
            <input type="text" class="form-control form-control-fm" id="of-code" maxlength="20" placeholder="e.g. FRESH10">
          </div>
          <div class="col-md-6">
            <label class="form-label">Target</label>
            <select class="form-select form-control-fm" id="of-target">
              <option value="">Whole Store</option>
              <option value="category">Specific Category</option>
              <option value="product">Specific Product</option>
            </select>
          </div>
          <div class="col-md-6 d-none" id="of-category-wrap">
            <label class="form-label">Category</label>
            <select class="form-select form-control-fm" id="of-category"></select>
          </div>
          <div class="col-md-6 d-none" id="of-product-wrap">
            <label class="form-label">Product</label>
            <select class="form-select form-control-fm" id="of-product"></select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Start Date</label>
            <input type="date" class="form-control form-control-fm" id="of-start">
          </div>
          <div class="col-md-6">
            <label class="form-label">End Date</label>
            <input type="date" class="form-control form-control-fm" id="of-end">
          </div>
          <div class="col-12 d-flex align-items-center gap-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="of-active" checked>
              <label class="form-check-label small" for="of-active">Active</label>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-admin-outline" data-bs-dismiss="modal">Cancel</button>
        <button class="btn-admin" id="save-offer-btn">Save Offer</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/admin/js/admin-app.js"></script>
<script src="/admin/js/offers.js"></script>
</body>
</html>
