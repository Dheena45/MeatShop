<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages — FreshMeat Admin</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥩</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

<div id="admin-shell"></div>

<!-- View message modal -->
<div class="modal fade" id="viewMessageModal" tabindex="-1" aria-labelledby="viewMessageModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="viewMessageModalLabel"><i class="fa-regular fa-envelope me-2"></i>Message</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex justify-content-between align-items-start gap-2 mb-3">
          <div>
            <div class="fw-semibold" id="vm-name"></div>
            <div class="text-muted small" id="vm-email"></div>
          </div>
          <div id="vm-status" class="text-end"></div>
        </div>
        <div class="p-3 rounded small" style="background:#f8f9fa;" id="vm-message"></div>
        <div class="text-muted mt-3" style="font-size:0.78rem;" id="vm-date"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-admin-outline" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Delete message confirmation modal -->
<div class="modal fade" id="deleteMessageModal" tabindex="-1" aria-labelledby="deleteMessageModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deleteMessageModalLabel"><i class="fa-solid fa-trash text-danger me-2"></i>Delete Message</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0">Are you sure you want to delete this message?</p>
        <div class="mt-3 p-3 rounded" style="background:#f8f9fa;">
          <div class="fw-semibold" id="dm-name"></div>
          <div class="text-muted small" id="dm-email"></div>
        </div>
        <p class="text-danger small mt-3 mb-0"><i class="fa-solid fa-triangle-exclamation me-1"></i>This action cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-admin-outline" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn-admin" id="confirm-delete-message-btn" style="background:#dc3545;border-color:#dc3545;">Delete Message</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/admin/js/admin-app.js"></script>
<script src="/admin/js/contact-messages.js"></script>
</body>
</html>
