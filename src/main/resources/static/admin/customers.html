<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers — FreshMeat Admin</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥩</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

<div id="admin-shell"></div>

<!-- Delete customer confirmation modal -->
<div class="modal fade" id="deleteCustomerModal" tabindex="-1" aria-labelledby="deleteCustomerModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deleteCustomerModalLabel"><i class="fa-solid fa-trash text-danger me-2"></i>Delete Customer</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0">Are you sure you want to delete this customer?</p>
        <div class="mt-3 p-3 rounded" style="background:#f8f9fa;">
          <div class="fw-semibold" id="dc-name"></div>
          <div class="text-muted small" id="dc-email"></div>
        </div>
        <p class="text-danger small mt-3 mb-0"><i class="fa-solid fa-triangle-exclamation me-1"></i>This action cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-admin-outline" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn-admin" id="confirm-delete-customer-btn" style="background:#dc3545;border-color:#dc3545;">Delete Customer</button>
      </div>
    </div>
  </div>
</div>

<!-- Deactivate / Activate customer confirmation modal -->
<div class="modal fade" id="toggleCustomerModal" tabindex="-1" aria-labelledby="toggleCustomerModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="toggleCustomerModalLabel"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0" id="toggle-customer-msg"></p>
        <div class="mt-3 p-3 rounded" style="background:#f8f9fa;">
          <div class="fw-semibold" id="toggle-customer-name"></div>
          <div class="text-muted small" id="toggle-customer-email"></div>
        </div>
        <p class="text-danger small mt-3 mb-0" id="toggle-customer-warn">
          <i class="fa-solid fa-triangle-exclamation me-1"></i>The customer will not be able to use the account while inactive.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-admin-outline" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn-admin" id="confirm-toggle-customer-btn"></button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/admin/js/admin-app.js"></script>
<script src="/admin/js/customers.js"></script>
</body>
</html>
