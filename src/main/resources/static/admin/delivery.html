<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Management — FreshMeat Admin</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥩</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

<div id="admin-shell"></div>

<!-- Assign / Reassign Delivery Boy -->
<div class="modal fade" id="assignModal" tabindex="-1" aria-labelledby="assignModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="assignModalLabel"><i class="fa-solid fa-user-plus text-primary me-2"></i>Assign Delivery Boy</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-2" style="font-size:0.85rem;">Order <strong id="as-order-no">-</strong></p>
        <div class="p-3 rounded mb-3" style="background:#f8f5f0;" id="as-summary"></div>
        <label class="form-label" for="as-boy">Delivery Boy</label>
        <select class="form-select form-control-fm" id="as-boy"></select>
        <div class="form-text text-muted" style="font-size:0.75rem;" id="as-hint">Only active Delivery Boys are listed.</div>
        <div class="row g-2 mt-2">
          <div class="col-6">
            <label class="form-label" for="as-date">Delivery Date</label>
            <input type="date" class="form-control form-control-fm" id="as-date">
          </div>
          <div class="col-6">
            <label class="form-label" for="as-slot">Delivery Slot</label>
            <select class="form-select form-control-fm" id="as-slot"></select>
          </div>
        </div>
        <div class="form-text text-muted" style="font-size:0.75rem;">The slot list follows the weekday/weekend rules the customer saw at checkout.</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-admin-outline" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn-admin" id="as-confirm">Assign</button>
      </div>
    </div>
  </div>
</div>

<!-- Order detail modal (shared with the Orders page) -->
<div class="modal fade" id="orderModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="fa-solid fa-receipt me-2 text-primary"></i>Order #<span id="om-number"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="om-body"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/admin/js/admin-app.js"></script>
<script src="/admin/js/delivery.js"></script>
</body>
</html>
