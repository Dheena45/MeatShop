<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders — FreshMeat Admin</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥩</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

<div id="admin-shell"></div>

<!-- Order detail modal -->
<div class="modal fade" id="orderModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="fa-solid fa-receipt me-2 text-primary"></i>Order #<span id="om-number"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="om-body"></div>
    </div>
  </div>
</div>

<!-- Order status update confirmation modal -->
<div class="modal fade" id="orderStatusModal" tabindex="-1" aria-labelledby="orderStatusModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="orderStatusModalLabel"><i class="fa-solid fa-triangle-exclamation text-warning me-2"></i>Update Order Status</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0" id="order-status-confirm-msg">Are you sure you want to change this order status?</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-admin-outline" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn-admin" id="order-status-confirm-btn">Update Status</button>
      </div>
    </div>
  </div>
</div>

<!-- Mark payment received confirmation modal -->
<div class="modal fade" id="paymentModal" tabindex="-1" aria-labelledby="paymentModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="paymentModalLabel"><i class="fa-solid fa-money-bill-wave text-success me-2"></i>Mark Payment Received</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0" id="payment-confirm-msg">Confirm that this payment has been received.</p>
        <input type="text" class="form-control form-control-fm mt-3" id="payment-transaction-ref"
               placeholder="Transaction ref / note (optional)" maxlength="100">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-admin-outline" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn-admin" id="payment-confirm-btn">Confirm Payment</button>
      </div>
    </div>
  </div>
</div>

<!-- Invoice modal (in-page) -->
<div class="modal fade" id="invoiceModal" tabindex="-1" aria-labelledby="invoiceModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width:460px;">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="invoiceModalLabel"><i class="fa-solid fa-file-invoice text-primary me-2"></i>Invoice</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body invoice-modal-sheet" id="invoice-modal-body">
        <div class="text-center text-muted py-4">Loading invoice...</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-admin" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Assign / Reassign Delivery Boy modal -->
<div class="modal fade" id="assignDeliveryModal" tabindex="-1" aria-labelledby="assignDeliveryModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="assignDeliveryModalLabel"><i class="fa-solid fa-user-plus text-primary me-2"></i>Assign Delivery Boy</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-2" style="font-size:0.85rem;">Order <strong id="assign-order-number">-</strong></p>
        <div class="p-3 rounded mb-3" style="background:#f8f5f0;" id="assign-summary"></div>
        <label class="form-label" for="assign-boy-select">Delivery Boy</label>
        <select class="form-select form-control-fm" id="assign-boy-select"></select>
        <div class="form-text text-muted" style="font-size:0.75rem;">Only active Delivery Boys are listed.</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-admin-outline" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn-admin" id="assign-confirm-btn">Assign</button>
      </div>
    </div>
  </div>
</div>

<!-- 80mm thermal receipt print target (screen-hidden, print-only) -->
<div id="receipt-print" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/admin/js/admin-app.js"></script>
<script src="/admin/js/orders.js"></script>
</body>
</html>
