<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — FreshMeat</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥩</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-head">
            <h2 style="font-family:var(--font-head);">Forgot <span style="color:var(--gold-light)">Password</span></h2>
            <p>Enter your registered email address.</p>
        </div>
        <div class="auth-body">
            <form id="forgot-form" novalidate>
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Email Address</label>
                    <input type="email" class="form-control form-control-fm" id="forgot-email" placeholder="you@example.com" required>
                </div>
                <button class="btn btn-fm w-100 btn-fm-lg" type="submit" id="forgot-btn">
                    <i class="fa-solid fa-paper-plane me-2"></i>Send Reset Link
                </button>
            </form>

            <div class="auth-divider"><span>Remembered it?</span></div>
            <a href="/login.html" class="btn btn-fm-outline w-100">Back to Login</a>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
