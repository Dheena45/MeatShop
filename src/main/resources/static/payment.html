<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment — FreshMeat</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥩</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .pay-card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 2rem 1.6rem; max-width: 480px; margin: 0 auto; }
        .pay-card .pay-row { display: flex; justify-content: space-between; font-size: 0.92rem; padding: 0.5rem 0; border-bottom: 1px dashed var(--bg-alt); }
        .pay-demo-badge { display: inline-flex; align-items: center; gap: 6px; background: #fff4e0; color: #b45309; font-size: 0.72rem; font-weight: 600; padding: 4px 10px; border-radius: 50px; letter-spacing: 0.4px; }
        .pay-icon-circle { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; background: var(--primary); color: #fff; }
        .pay-icon-circle.ok { background: var(--success); }
        .pay-icon-circle.fail { background: var(--danger); }
        .pay-amount { font-size: 1.9rem; font-weight: 700; color: var(--charcoal); }
    </style>
</head>
<body>

<div id="shared-header"></div>

<section class="section-pad pt-4">
    <div class="container" style="max-width:760px;">
        <div id="pay-loading"><div class="loader-spinner"></div></div>
        <div id="pay-box" class="d-none"></div>
    </div>
</section>

<div id="shared-footer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/payment.js"></script>
</body>
</html>
