<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — FreshMeat</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥩</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-head">
            <h2 style="font-family:var(--font-head);">Join <span style="color:var(--gold-light)">FreshMeat</span></h2>
            <p>Create your account to start ordering fresh.</p>
        </div>
        <div class="auth-body">
            <form id="register-form" novalidate>
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Full Name</label>
                    <input type="text" class="form-control form-control-fm" id="name" placeholder="Your full name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Email Address</label>
                    <input type="email" class="form-control form-control-fm" id="email" placeholder="you@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Mobile Number</label>
                    <input type="tel" class="form-control form-control-fm" id="phone" placeholder="10-digit mobile" maxlength="10" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Password</label>
                    <input type="password" class="form-control form-control-fm" id="password" placeholder="Min 6 characters" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Confirm Password</label>
                    <input type="password" class="form-control form-control-fm" id="confirm" placeholder="Re-enter password" required>
                </div>
                <button class="btn btn-fm w-100 btn-fm-lg" type="submit" id="register-btn">
                    <i class="fa-solid fa-user-plus me-2"></i>Create Account
                </button>
            </form>

            <div class="auth-divider"><span>Already have an account?</span></div>
            <a href="/login.html" class="btn btn-fm-outline w-100">Login Instead</a>
            <p class="text-center mt-3 small text-muted mb-0">By creating an account you agree to our Terms &amp; Privacy Policy.</p>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
